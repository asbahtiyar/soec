<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOEC - Eğitim | Danışmanlık | Yayıncılık</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e1e24 0%, #0d0d0f 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 20px 20px;
        }

        /* Üst Logo */
        header {
            text-align: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 50px;
        }

        .logo {
            max-width: 400px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
        }

        /* Ana İçerik: 3 Kare Buton */
        main {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            width: 100%;
        }

        /* Premium Kare Kart Tasarımı */
        .card {
            background: linear-gradient(145deg, #1d1d23, #16161a);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            aspect-ratio: 1 / 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #e50914;
            box-shadow: 0 16px 35px rgba(229, 9, 20, 0.3);
        }

        .card-icon {
            width: 52px;
            height: 52px;
            margin-bottom: 20px;
            fill: none;
            stroke: #e50914;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.1);
        }

        .card h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
            letter-spacing: 0.3px;
        }

        /* Alt Alan (Footer) - Kontrast Yükseltildi */
        footer {
            width: 100%;
            max-width: 1100px;
            margin-top: 50px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Hakkımızda, Tel, Adres Satırı */
        .footer-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #d1d5db; /* Açık ve Okunabilir Gri */
            margin-bottom: 20px;
            gap: 20px;
        }

        .footer-info-row a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .footer-info-row a:hover {
            color: #e50914;
            text-decoration: underline;
        }

        .footer-info-row .phone {
            white-space: nowrap;
            color: #e2e8f0;
        }

        .footer-info-row .address {
            text-align: right;
            color: #e2e8f0;
        }

        /* En Alt Yazı */
        .footer-bottom {
            text-align: center;
            font-size: 0.8rem;
            color: #9ca3af; /* Belirgin Gri */
            letter-spacing: 0.5px;
        }

        /* Mobil Uyum (< 768px) */
        @media (max-width: 768px) {
            .button-container {
                grid-template-columns: 1fr;
                max-width: 280px;
                margin: 0 auto;
            }

            .footer-info-row {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .footer-info-row .address {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="soec-logo.png" alt="SOEC - Eğitim Danışmanlık Yayıncılık" class="logo">
    </header>

    <main>
        <div class="button-container">
            
            <a href="egitim-danismanligi.html" class="card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <polyline points="16 11 18 13 22 9"></polyline>
                </svg>
                <h2>EĞİTİM DANIŞMANLIĞI</h2>
            </a>

            <a href="egitim-yayinciligi.html" class="card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <h2>EĞİTİM YAYINCILIĞI</h2>
            </a>

            <a href="sat-ap-ib-ozel-ders.html" class="card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
                <h2>SAT - AP - IB<br>ÖZEL DERS</h2>
            </a>

        </div>
    </main>

    <footer>
        <div class="footer-info-row">
            <a href="hakkimizda.html">Hakkımızda</a>
	    <span class="address">Adres: Zühtüpaşa Mah. Şefikbey Sk. No:3 Kadıköy/İstanbul</span>
            <span class="phone">Tel: +90 (545) 460 23 76</span>
        </div>

        <div class="footer-bottom">
            © SOEC 2026 — Tüm Hakları Saklıdır.
        </div>
    </footer>

</body>
</html>
